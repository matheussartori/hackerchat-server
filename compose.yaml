# Local development.
#
#   docker compose up            build and run with live reload
#   docker compose up --build    rebuild after a dependency change
#   docker compose down          stop and clean up
#
# Source is bind-mounted, so `tsx watch` restarts on every save without a rebuild.
# For production see compose.prod.yaml.

services:
  server:
    build:
      context: .
      target: dev
    image: hackerchat-server:dev
    container_name: hackerchat-server-dev
    restart: unless-stopped
    ports:
      - "${PORT:-9898}:9898"
    environment:
      NODE_ENV: development
      PORT: 9898
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      # Source only. node_modules stays in the image, so a host install (or the
      # lack of one) cannot shadow the container's dependencies.
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9898/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
